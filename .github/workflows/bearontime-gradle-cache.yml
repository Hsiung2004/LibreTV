name: BearOnTime Gradle Dependency Cache

on:
  push:
    branches:
      - bearontime-build-alpha3
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export-gradle-cache:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        run: yes | sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Warm Android Gradle dependency cache
        working-directory: bearontime
        run: gradle --no-daemon :app:assembleDebug --stacktrace

      - name: Package Gradle caches
        shell: bash
        run: |
          set -euo pipefail
          du -sh "$HOME/.gradle/caches" || true
          tar -C "$HOME/.gradle" -czf bearontime-gradle-cache.tar.gz caches
          ls -lh bearontime-gradle-cache.tar.gz

      - name: Upload dependency cache artifact
        uses: actions/upload-artifact@v4
        with:
          name: BearOnTime-Gradle89-AndroidPlugin-Cache
          path: bearontime-gradle-cache.tar.gz
          retention-days: 1
          if-no-files-found: error

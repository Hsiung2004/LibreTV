name: Bear SDK export v110
on:
  push:
    branches: [bear-tools-20260825-voice-theme]
jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Pack Android SDK tools
        run: |
          SDK="$ANDROID_HOME"
          PLATFORM=$(ls -d "$SDK"/platforms/android-* | sort -V | tail -1)
          BUILD=$(ls -d "$SDK"/build-tools/* | sort -V | tail -1)
          mkdir -p out/build-tools
          cp "$PLATFORM/android.jar" out/android.jar
          cp "$BUILD/d8" out/build-tools/d8
          cp "$BUILD/d8.jar" out/build-tools/d8.jar
          cp "$BUILD/aapt2" out/build-tools/aapt2
          cp "$BUILD/apksigner" out/build-tools/apksigner
          cp "$BUILD/apksigner.jar" out/build-tools/apksigner.jar
          cp "$BUILD/zipalign" out/build-tools/zipalign
      - uses: actions/upload-artifact@v4
        with:
          name: bear-sdk-v110
          path: out
          retention-days: 1

name: BearOnTime Toolchain Export

on:
  push:
    branches:
      - bearontime-build-alpha3
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export-toolchain:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install required Android SDK
        run: yes | sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Package minimal build toolchain
        shell: bash
        run: |
          set -euo pipefail
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          echo "Gradle: $(command -v gradle)"
          GRADLE_BIN="$(readlink -f "$(command -v gradle)")"
          GRADLE_HOME="$(cd "$(dirname "$GRADLE_BIN")/.." && pwd)"
          mkdir -p export/android-sdk export/gradle
          cp -a "$ANDROID_SDK_ROOT/platforms/android-35" export/android-sdk/
          cp -a "$ANDROID_SDK_ROOT/build-tools/35.0.0" export/android-sdk/build-tools-35.0.0
          if [ -d "$ANDROID_SDK_ROOT/licenses" ]; then cp -a "$ANDROID_SDK_ROOT/licenses" export/android-sdk/; fi
          cp -a "$GRADLE_HOME"/. export/gradle/
          tar -C export -czf bearontime-toolchain.tar.gz android-sdk gradle
          ls -lh bearontime-toolchain.tar.gz

      - name: Upload toolchain artifact
        uses: actions/upload-artifact@v4
        with:
          name: BearOnTime-Android35-Gradle89-Toolchain
          path: bearontime-toolchain.tar.gz
          retention-days: 1
          if-no-files-found: error

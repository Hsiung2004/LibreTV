name: BearOnTime Android Build

on:
  push:
    branches:
      - bearontime-build-alpha2
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        run: yes | sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Source audit
        working-directory: bearontime
        run: python3 tools/source_audit.py

      - name: Build debug APK
        working-directory: bearontime
        run: gradle --no-daemon :app:assembleDebug --stacktrace

      - name: Rename APK
        run: |
          mkdir -p out
          cp bearontime/app/build/outputs/apk/debug/app-debug.apk "out/BearOnTime_V1.0.0_Alpha2_DEV.apk"
          sha256sum "out/BearOnTime_V1.0.0_Alpha2_DEV.apk" > "out/BearOnTime_V1.0.0_Alpha2_DEV_SHA256.txt"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: BearOnTime-V1.0.0-Alpha2-DEV
          path: out/*
          retention-days: 7
          if-no-files-found: error

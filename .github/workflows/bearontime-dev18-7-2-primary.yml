name: BearOnTime DEV18.7.2 Primary DEX Build

on:
  push:
    branches: [bearontime-dev18-7-2-primary]

jobs:
  build-dex:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Locate Android SDK
        shell: bash
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME/platforms" | tail
          ls "$ANDROID_HOME/build-tools" | tail
      - name: Compile primary classes.dex
        shell: bash
        run: |
          set -euo pipefail
          PLATFORM=$(find "$ANDROID_HOME/platforms" -maxdepth 1 -type d -name 'android-*' | sort -V | tail -1)
          BUILD_TOOLS=$(find "$ANDROID_HOME/build-tools" -maxdepth 1 -mindepth 1 -type d | sort -V | tail -1)
          mkdir -p build/classes build/dex
          find bearontime_primary/src -name '*.java' -print0 | xargs -0 javac -source 8 -target 8 -encoding UTF-8 -classpath "$PLATFORM/android.jar" -d build/classes
          "$BUILD_TOOLS/d8" --lib "$PLATFORM/android.jar" --min-api 23 --output build/dex build/classes
          test -f build/dex/classes.dex
          sha256sum build/dex/classes.dex
      - uses: actions/upload-artifact@v4
        with:
          name: bearontime-dev18-7-2-primary-dex
          path: build/dex/classes.dex
          retention-days: 1

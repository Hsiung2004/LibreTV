name: BearOnTime DEV18.12 Widget DEX Build

on:
  push:
    branches: [bearontime-dev18-12-widget]

jobs:
  build-dex:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile primary and widget DEX
        shell: bash
        run: |
          set -euo pipefail
          PLATFORM=$(find "$ANDROID_HOME/platforms" -maxdepth 1 -type d -name 'android-*' | sort -V | tail -1)
          BUILD_TOOLS=$(find "$ANDROID_HOME/build-tools" -maxdepth 1 -mindepth 1 -type d | sort -V | tail -1)

          mkdir -p build/primary-classes build/primary-dex
          find bearontime_primary/src -name '*.java' -print0 | xargs -0 javac -source 8 -target 8 -encoding UTF-8 -classpath "$PLATFORM/android.jar" -d build/primary-classes
          jar cf build/primary.jar -C build/primary-classes .
          "$BUILD_TOOLS/d8" --lib "$PLATFORM/android.jar" --min-api 23 --output build/primary-dex build/primary.jar
          test -f build/primary-dex/classes.dex
          cp build/primary-dex/classes.dex build/classes.dex

          mkdir -p build/widget-classes build/widget-dex
          find bearontime_widget/src -name '*.java' -print0 | xargs -0 javac -source 8 -target 8 -encoding UTF-8 -classpath "$PLATFORM/android.jar" -d build/widget-classes
          jar cf build/widget.jar -C build/widget-classes .
          "$BUILD_TOOLS/d8" --lib "$PLATFORM/android.jar" --min-api 23 --output build/widget-dex build/widget.jar
          test -f build/widget-dex/classes.dex
          cp build/widget-dex/classes.dex build/classes2.dex

          sha256sum build/classes.dex build/classes2.dex
      - uses: actions/upload-artifact@v4
        with:
          name: bearontime-dev18-12-dex
          path: |
            build/classes.dex
            build/classes2.dex
          retention-days: 1
